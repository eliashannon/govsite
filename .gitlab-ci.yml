stages:
  - validate

validate-portal:
  stage: validate
  script:
    - printf 'window.BuildInfo = {name:"Training & Qualification Portal",version:"1.0.0",environment:"GitLab CI",pipeline:"%s",lastUpdated:"%s"};\n' "$CI_PIPELINE_IID" "$(date -u +%Y-%m-%d)" > build-info.js
    - printf 'window.BuildInfo.refresh = () => {\n    document.querySelectorAll("[data-build-version]").forEach(el => el.textContent = `Version ${window.BuildInfo.version}`);\n    document.querySelectorAll("[data-build-environment]").forEach(el => el.textContent = window.BuildInfo.environment);\n    document.querySelectorAll("[data-build-pipeline]").forEach(el => el.textContent = `Pipeline #${window.BuildInfo.pipeline}`);\n};\ndocument.addEventListener("DOMContentLoaded", window.BuildInfo.refresh);\n' >> build-info.js
    - echo "Validating Training Portal project structure..."
    - test -f index.html
    - test -f training.html
    - test -f role-overview.html
    - test -f required-training.html
    - test -f tqs-support.html
    - test -f key-references.html
    - test -f contact.html
    - test -f variables.css
    - test -f global.css
    - test -f layout.css
    - test -f components.css
    - test -f responsive.css
    - test -f account.js
    - test -f build-info.js
    - test -f data.js
    - test -f navigation.js
    - test -f references.js
    - test -f search.js
    - test -f training.js
    - echo "All required portal files were found."
