stages:
  - validate

validate-portal:
  stage: validate
  script:
    - echo "Validating Training Portal project structure..."
    - test -f index.html
    - test -f training.html
    - test -f role-overview.html
    - test -f required-training.html
    - test -f tqs-support.html
    - test -f key-references.html
    - test -f contact.html
    - test -f assets/shared/css/variables.css
    - test -f assets/shared/css/global.css
    - test -f assets/shared/css/layout.css
    - test -f assets/shared/css/components.css
    - test -f assets/shared/css/responsive.css
    - test -f assets/shared/js/account.js
    - test -f assets/shared/js/build-info.js
    - test -f assets/shared/js/data.js
    - test -f assets/shared/js/navigation.js
    - test -f assets/shared/js/search.js
    - test -f assets/pages/account/account.css
    - test -f assets/pages/dashboard/dashboard.css
    - test -f assets/pages/dashboard/dashboard.js
    - test -f assets/pages/key-references/references.js
    - test -f assets/pages/role-overview/role-overview.js
    - test -f assets/pages/tqs-support/tqs-support.js
    - test -f assets/pages/training-center/training.js
    - test -f assets/pages/training-courses/required-training.css
    - test -f assets/pages/training-courses/required-training.js
    - echo "All required portal files were found."
